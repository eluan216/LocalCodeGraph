name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dense]"
      - run: python -m unittest discover -s tests -v
      - run: lcg --db smoke.sqlite index examples/toy_repo
      - run: lcg --db smoke.sqlite context "decode input"
      - run: python -m localcodegraph.evaluation --db smoke.sqlite --tasks examples/tasks.jsonl
