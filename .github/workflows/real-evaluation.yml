name: real-world-retrieval
on:
  pull_request:
    paths:
      - 'benchmarks/**'
      - '.github/workflows/real-evaluation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  swebench-lite-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pyarrow unidiff
      - run: python -m unittest discover -s tests -v
      - run: python benchmarks/run_swebench_lite.py --output results/real-world.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swebench-lite-dev
          path: results/
